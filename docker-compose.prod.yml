# Beaver — Docker self-hosting (production).
#
# Builds and runs the full stack on a single host:
#   postgres + redis (internal only) + api (:3001) + web (:80).
#
# Build-time: the web image bakes NEXT_PUBLIC_API_URL, so set it to the publicly
# reachable API origin BEFORE building, e.g.:
#
#   BEAVER_PUBLIC_API_URL=https://api.example.com \
#   docker compose -f docker-compose.prod.yml up -d --build
#
# If you host web and API on the same origin behind a reverse proxy, route /api/* to
# the api service and point BEAVER_PUBLIC_API_URL at that origin.
#
# All secrets come from a .env (or the shell). See .env.example for the keys.

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beaver_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-beaver}
    # Not exposed on the host in prod — only reachable inside the network.
    expose:
      - "5432"
    volumes:
      - beaver_pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beaver} -d ${POSTGRES_DB:-beaver}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - beaver_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # PgBouncer — transaction-mode connection pooler in front of Postgres.
  # The API connects through it (bounded pool); migrations use DIRECT_URL directly.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-beaver}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-beaver_dev_password}
      DB_NAME: ${POSTGRES_DB:-beaver}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENTS:-100}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-10}
      AUTH_TYPE: scram-sha-256
    expose:
      - "5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-beaver} -d ${POSTGRES_DB:-beaver}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Runtime: pool through PgBouncer. Direct DB access (migrations) via DIRECT_URL.
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver_dev_password}@pgbouncer:5432/${POSTGRES_DB:-beaver}?schema=public&pgbouncer=true&connection_limit=10
      DIRECT_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver_dev_password}@postgres:5432/${POSTGRES_DB:-beaver}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      API_PORT: "3001"
      NODE_ENV: production
      CORS_ORIGINS: ${BEAVER_WEB_ORIGIN:-http://localhost:80}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-1209600}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # AI is off by default in production; set OPENROUTER_API_KEY to enable it.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-minimax/minimax-m3:free}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-minimax/minimax-m2.7:free}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-minimax/minimax-m3:free}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      # Optional observability.
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional data retention (0 disables the sweep).
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      MOVEMENT_RETENTION_DAYS: ${MOVEMENT_RETENTION_DAYS:-730}
    ports:
      - "${BEAVER_API_PORT:-3001}:3001"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3001/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\" "]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${BEAVER_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BEAVER_WEB_PORT:-80}:3000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  beaver_pgdata:
  beaver_redisdata:
