name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Install · test · typecheck · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: beaver
          POSTGRES_PASSWORD: beaver_dev_password
          POSTGRES_DB: beaver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beaver -d beaver"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://beaver:beaver_dev_password@localhost:5432/beaver?schema=public
      DIRECT_URL: postgresql://beaver:beaver_dev_password@localhost:5432/beaver?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache Bun deps
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock*') }}
          restore-keys: bun-${{ runner.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: bun run prisma generate

      - name: Apply migrations
        working-directory: apps/api
        run: bun run db:deploy

      - name: Test (API)
        working-directory: apps/api
        run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov --coverage-dir=coverage
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload API coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: warn

      - name: Test (shared)
        working-directory: packages/shared
        run: bun test

      - name: Test (web)
        working-directory: apps/web
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker-build:
    name: Docker build (api + web images)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: beaver-api:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          load: true
          tags: beaver-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
