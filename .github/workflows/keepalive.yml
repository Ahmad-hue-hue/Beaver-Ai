name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render API health
        run: |
          curl -sS --max-time 150 "https://beaver-api-97zs.onrender.com/api/v1/health/ready" -o /dev/null -w "api_status:%{http_code} in %{time_total}s\n" || true