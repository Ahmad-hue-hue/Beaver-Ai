services:
  postgres:
    # pgvector image so the vector extension is available if/when document-RAG or
    # semantic memory is added later. pg_trgm ships with Postgres contrib.
    image: pgvector/pgvector:pg18
    container_name: beaver_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beaver_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-beaver}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG18 images store data in a versioned subdir; mount the parent, not /data.
      - beaver_pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beaver} -d ${POSTGRES_DB:-beaver}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: beaver_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - beaver_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  beaver_pgdata:
  beaver_redisdata:
